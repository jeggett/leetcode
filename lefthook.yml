pre-commit:
  parallel: true
  commands:
    typescript-format:
      glob: "*.{ts,mjs}"
      run: mise exec -- pnpm exec biome format {staged_files}
    typescript-lint:
      glob: "*.{ts,mjs}"
      run: mise exec -- pnpm exec biome lint {staged_files}
    python-format:
      glob: "*.py"
      run: mise exec -- uv run ruff format --check {staged_files}
    python-lint:
      glob: "*.py"
      run: mise exec -- uv run ruff check {staged_files}
