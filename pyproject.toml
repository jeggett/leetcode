[project]
name = "leetcode"
version = "1.0.0"
description = "LeetCode problem solutions"
requires-python = ">=3.14"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.pytest.ini_options]
addopts = ["--capture=sys"]
pythonpath = ["."]
testpaths = ["src/python", "tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
