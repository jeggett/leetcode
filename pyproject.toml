[project]
name = "leetcode"
version = "1.0.0"
description = "LeetCode problem solutions"
requires-python = ">=3.14"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-timeout==2.4.0",
    "pytest-watcher==0.6.3",
    "ruff==0.16.2",
]

[tool.pytest.ini_options]
addopts = ["--capture=sys"]
timeout = 10
pythonpath = ["."]
testpaths = ["src/python", "tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
