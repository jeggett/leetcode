name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      MISE_IDIOMATIC_VERSION_FILE_ENABLE_TOOLS: node,pnpm
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          install: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
      - run: pnpm ready
